# Standalone topology definition for Milvus.
config:
  # parametersSchema references a Go type in definition/topologies/standalone
  # for topology parameters (bundled dependency sizing and external overrides).
  parametersSchema: StandaloneTopologyParameters
  components:
    standalone:
      type: milvus
      replicas: 1
      supportedFields:
        properties:
          replicas: {minimum: 1, maximum: 1}
          resources: {}
          service: {}
          schedulingPolicy: {}
ui:
  sections:
    basicInfo:
      label: Basic Information
      description: Configure the standalone Milvus deployment.
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: Milvus Version
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: name
              valuePath: name
    resources:
      label: Resources
      description: Configure the core resources for the deployment.
      components:
        cpu:
          uiType: number
          path: spec.components.standalone.resources.limits.cpu
          fieldParams:
            label: CPU
            defaultValue: 1
            step: 0.1
          validation:
            min: 0.1
            required: true
        memory:
          uiType: number
          path: spec.components.standalone.resources.limits.memory
          fieldParams:
            label: Memory
            defaultValue: 4
            step: 0.1
            badge: Gi
            badgeToApi: true
          validation:
            min: 0.5
            required: true
        externalAccess:
          uiType: select
          path: spec.components.standalone.service.serviceType
          fieldParams:
            label: External access
            defaultValue: ClusterIP
            options:
              - label: ClusterIP
                value: ClusterIP
              - label: NodePort
                value: NodePort
              - label: LoadBalancer
                value: LoadBalancer
    objectStorage:
      label: Object storage
      description: Configure the bundled object storage that holds Milvus data.
      components:
        replicas:
          path: spec.topology.parameters.dependencies.storage.replicas
          uiType: number
          fieldParams:
            label: Replicas
            defaultValue: 1
          validation:
            min: 1
            int: true
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: spec.topology.parameters.dependencies.storage.resources.requests.cpu
              uiType: number
              fieldParams:
                label: CPU
                defaultValue: 0.1
                step: 0.1
              validation:
                min: 0.1
            memory:
              path: spec.topology.parameters.dependencies.storage.resources.requests.memory
              uiType: number
              fieldParams:
                label: RAM
                defaultValue: 0.25
                step: 0.1
                badge: Gi
                badgeToApi: true
              validation:
                min: 0.1
            storage:
              path: spec.topology.parameters.dependencies.storage.persistence.size
              uiType: number
              fieldParams:
                label: Storage
                defaultValue: 10
                badge: Gi
                badgeToApi: true
              validation:
                min: 1
                int: true
      componentsOrder:
        - replicas
        - resources
    metadataStore:
      label: Metadata store
      description: Configure the bundled metadata store.
      components:
        replicas:
          path: spec.topology.parameters.dependencies.etcd.replicas
          uiType: number
          fieldParams:
            label: Replicas
            defaultValue: 1
          validation:
            min: 1
            int: true
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: spec.topology.parameters.dependencies.etcd.resources.requests.cpu
              uiType: number
              fieldParams:
                label: CPU
                defaultValue: 0.1
                step: 0.1
              validation:
                min: 0.1
            memory:
              path: spec.topology.parameters.dependencies.etcd.resources.requests.memory
              uiType: number
              fieldParams:
                label: RAM
                defaultValue: 0.25
                step: 0.1
                badge: Gi
                badgeToApi: true
              validation:
                min: 0.1
            storage:
              path: spec.topology.parameters.dependencies.etcd.persistence.size
              uiType: number
              fieldParams:
                label: Storage
                defaultValue: 10
                badge: Gi
                badgeToApi: true
              validation:
                min: 1
                int: true
      componentsOrder:
        - replicas
        - resources
    monitoring:
      label: "Monitoring"
      description: "Collect Milvus metrics with Prometheus."
      components:
        prometheus:
          uiType: toggle
          path: spec.topology.parameters.monitoring.prometheus.enabled
          fieldParams:
            label: "Prometheus"
            helperText: "Creates a PodMonitor that scrapes Milvus metrics. Requires the Prometheus Operator."
      componentsOrder:
        - prometheus
    advanced:
      label: "Advanced configuration"
      description: "Configure advanced Milvus engine settings."
      components:
        configuration:
          uiType: text
          path: spec.components.standalone.parameters.configuration
          fieldParams:
            label: "Engine configuration"
            placeholder: |2
              log:
                level: info
              proxy:
                maxNameLength: 255
            multiline: true
            minRows: 3
            maxRows: 8
        podSchedulingPolicy:
          uiType: group
          groupType: toggleable
          label: Pod scheduling policy
          components:
            policy:
              uiType: widget
              widgetType: podSchedulingPolicy
      componentsOrder:
        - configuration
        - podSchedulingPolicy
  sectionsOrder:
    - basicInfo
    - resources
    - objectStorage
    - metadataStore
    - monitoring
    - advanced
