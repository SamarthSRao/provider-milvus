# Example multi-AZ cluster Milvus Instance for the provider-milvus provider.
# Spreads query nodes, data nodes, proxies, coordinators, and streaming nodes
# evenly across availability zones. Active-standby is enabled automatically
# in cluster mode, so running two MixCoord replicas allows the standby to take
# over if the active replica's zone fails.
#
# Note: schedulingPolicy does not reach bundled dependencies (etcd and MinIO),
# which use zonal persistent volumes and unconstrained placement. A zone loss
# can still take them down; true multi-AZ tolerance requires external etcd and
# S3-compatible storage.
#
# A topology spread constraint without a labelSelector counts this
# component's own pods. whenUnsatisfiable: DoNotSchedule keeps pods Pending
# rather than piling them into one zone; use ScheduleAnyway for a soft spread.
#
# Prerequisites:
#   1. OpenEverest CRDs installed
#   2. Provider CR applied (provider.yaml)
#   3. Operator running
#   4. Provider controller running
#   5. Nodes labelled with topology.kubernetes.io/zone (at least 2 zones)
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: milvus-multi-az
spec:
  providerRef:
    name: milvus
  version: "2.6.15"
  topology:
    type: cluster
  components:
    proxy:
      type: milvus
      replicas: 2
      schedulingPolicy:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
    mixCoord:
      type: milvus
      # Active-standby: the second replica takes over if the active one fails.
      replicas: 2
      schedulingPolicy:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
    dataNode:
      type: milvus
      replicas: 2
      schedulingPolicy:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
    queryNode:
      type: milvus
      replicas: 2
      schedulingPolicy:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
    streamingNode:
      type: milvus
      # Streaming nodes own WAL channels in 2.6; run at least 2 across zones to survive zone loss.
      replicas: 2
      schedulingPolicy:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
