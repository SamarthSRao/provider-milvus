# Example cluster Milvus Instance for the provider-milvus provider.
# Cluster mode splits Milvus into independently scalable components. Its
# write-ahead log defaults to Woodpecker, which keeps the WAL in the object
# storage; set dependencies.messageStreamType: pulsar to run a bundled Pulsar
# instead (the pulsar block below is ignored otherwise). It is heavier than
# standalone — prefer standalone for experimentation.
#
# Prerequisites:
#   1. OpenEverest CRDs installed
#   2. Provider CR applied (provider.yaml)
#   3. Operator running
#   4. Provider controller running
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: milvus-cluster
spec:
  providerRef:
    name: milvus
  version: "2.6.15"
  topology:
    type: cluster
    # Tune the operator-managed dependencies (etcd, MinIO, optional Pulsar).
    # Every field is optional; unset fields fall back to the provider's modest
    # defaults.
    parameters:
      dependencies:
        messageStreamType: woodpecker
        etcd:
          replicas: 3
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
          persistence:
            size: 10Gi
        storage:
          replicas: 1
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
          persistence:
            size: 10Gi
        pulsar:
          broker:
            replicas: 1
          bookkeeper:
            replicas: 2
            journal:
              size: 5Gi
            ledgers:
              size: 10Gi
          zookeeper:
            replicas: 1
            data:
              size: 5Gi
          proxy:
            replicas: 1
  components:
    proxy:
      type: milvus
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
    mixCoord:
      type: milvus
      replicas: 1
    dataNode:
      type: milvus
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 4Gi
    queryNode:
      type: milvus
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 4Gi
    streamingNode:
      type: milvus
      replicas: 1
