# Example standalone Milvus Instance for the provider-milvus provider.
# Apply this to your cluster to create a Milvus instance.
#
# Prerequisites:
#   1. OpenEverest CRDs installed
#   2. Provider CR applied (provider.yaml)
#   3. Operator running
#   4. Provider controller running
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: milvus-standalone
spec:
  providerRef:
    name: milvus
  # Optional: pin the Milvus version bundle. Omit to use the provider default.
  version: "2.6.15"
  topology:
    type: standalone
    # Object storage (MinIO) PVC size lives on the storage dependency, not on
    # the stateless compute component.
    parameters:
      dependencies:
        storage:
          persistence:
            size: 10Gi
  components:
    standalone:
      type: milvus
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 4Gi
      # Optional: Milvus engine configuration, merged into spec.config.
      parameters:
        configuration: |
          log:
            level: info
