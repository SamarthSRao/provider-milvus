---
# Live end-to-end run (test/e2e/run-matrix.sh) with the real Milvus operator on
# a k3d cluster: standalone and cluster instances, upgrade, backup and restore,
# scaling and autoscaling. It takes about 30 minutes, so it runs nightly, on
# demand, and on pull requests labelled "e2e" instead of on every change.
name: E2E

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  IMG: provider-milvus:ci
  OPENEVEREST_BRANCH: main

jobs:
  e2e:
    name: E2E
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout OpenEverest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: openeverest/openeverest
          ref: ${{ env.OPENEVEREST_BRANCH }}
          path: _openeverest

      - name: Install Kubernetes tooling
        uses: ./.github/actions/setup-k8s-tools
        with:
          install-k3d: 'true'

      - name: Create k3d cluster
        run: |
          sudo modprobe br_netfilter
          make k3d-cluster-up

      - name: Build provider image
        run: make docker-build

      - name: Import image into k3d
        run: make load-image

      - name: Build OpenEverest controller
        working-directory: _openeverest
        run: make build-controller

      - name: Build OpenEverest controller Docker image
        working-directory: _openeverest
        run: make docker-build-controller

      - name: Import OpenEverest controller image into k3d
        run: make load-openeverest-controller-image

      - name: Install CRDs
        run: make install-crds
        env:
          OPENEVEREST_BRANCH: ${{ env.OPENEVEREST_BRANCH }}

      - name: Deploy provider with the Milvus operator
        run: |
          make deploy-provider-ci OPERATOR_REPLICAS=1
          kubectl -n provider-system rollout status deploy/provider-milvus-operator --timeout=5m

      - name: Deploy OpenEverest controller
        working-directory: _openeverest
        run: make deploy-test-controller

      - name: Wait for OpenEverest deployment to be ready
        working-directory: _openeverest
        run: make wait-test-controller

      # k3d ships without it (dev/k3d_config.yaml); autoscaling needs it.
      - name: Install metrics-server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm install metrics-server metrics-server/metrics-server -n kube-system \
            --set 'args={--kubelet-insecure-tls}' --wait --timeout 3m

      - name: Run make test-e2e-live
        run: make test-e2e-live E2E_NAMESPACE=milvus-e2e

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get instances,milvuses.milvus.io,backups.backup.openeverest.io,pods,pvc,hpa -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
          kubectl -n provider-system logs deploy/provider-milvus --tail=300 || true
          kubectl -n provider-system logs deploy/provider-milvus-operator --tail=300 || true
          df -h / || true
