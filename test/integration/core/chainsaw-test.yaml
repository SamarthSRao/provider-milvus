---
# Core lifecycle suite for the Milvus provider.
#
# The Milvus operator is scaled to 0 in CI (see the deploy-provider-ci Make
# target), so these steps test the provider's translation and status logic:
# apply an Instance, assert the Milvus CR the provider produces, simulate the
# operator marking the CR Healthy, and assert the Instance reaches Ready with
# connection details.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core
spec:
  description: |
    Lifecycle of a standalone Instance: create, authenticate, expose via
    NodePort and LoadBalancer, set a pod scheduling policy, and delete.

  # Collect diagnostics when a step fails.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,milvuses.milvus.io -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-milvus
        tail: 100

  steps:
    - name: provider-deployed
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            file: 10-assert.yaml

    # Simulate the Milvus operator (scaled to 0) marking the CR Healthy and
    # caught up with its spec. The provider then surfaces phase Ready and
    # writes the connection Secret.
    - name: instance-ready
      try:
        - script:
            content: |
              generation=$(kubectl get milvuses.milvus.io/test-instance -n $NAMESPACE -o jsonpath='{.metadata.generation}')
              kubectl patch milvuses.milvus.io/test-instance --subresource status -n $NAMESPACE \
                -p "{\"status\":{\"status\":\"Healthy\",\"observedGeneration\":$generation}}" --type=merge
        - assert:
            file: 11-assert.yaml

    - name: expose-node-port
      try:
        - apply:
            file: 20-expose-node-port.yaml
        - assert:
            file: 20-assert.yaml

    - name: expose-load-balancer
      try:
        - apply:
            file: 21-expose-load-balancer.yaml
        - assert:
            file: 21-assert.yaml

    - name: update-scheduling-policy
      try:
        - apply:
            file: 30-update-scheduling-policy.yaml
        - assert:
            file: 30-assert.yaml

    # Deleting the Instance runs the provider's Cleanup and removes its
    # finalizer; the owned Milvus CR and Secrets are garbage-collected. The
    # operator is scaled to 0, so clear any Milvus finalizers manually.
    - name: delete-instance
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete instance/test-instance --wait=false
              kubectl -n $NAMESPACE patch milvuses.milvus.io/test-instance \
                -p '{"metadata":{"finalizers":null}}' --type merge || true
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-instance
            for:
              deletion: {}
        - wait:
            apiVersion: milvus.io/v1beta1
            kind: Milvus
            name: test-instance
            for:
              deletion: {}
        - wait:
            apiVersion: v1
            kind: Secret
            name: test-instance-credentials
            for:
              deletion: {}
        - wait:
            apiVersion: v1
            kind: Secret
            name: test-instance-conn
            for:
              deletion: {}
