# Expected outcome of the create-instance step.
#
# Assert both the accepted Instance spec and the operator-native CR the
# provider must create from it. Chainsaw asserts are partial: only the
# fields listed here are checked.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
spec:
  providerRef:
    name: milvus
---
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: test-instance
spec:
  mode: standalone
  components:
    env:
      - name: COMMON_SECURITY_DEFAULTROOTPASSWORD
        valueFrom:
          secretKeyRef:
            name: test-instance-credentials
            key: password
    standalone:
      replicas: 1
      podLabels:
        core.openeverest.io/component: standalone
        core.openeverest.io/instance: test-instance
        core.openeverest.io/provider: milvus
      resources:
        limits:
          cpu: "1"
          memory: 1G
  config:
    common:
      security:
        authorizationEnabled: true
        # The root password comes from the Secret, never from the CR.
        (defaultRootPassword == null): true
  dependencies:
    storage:
      inCluster:
        values:
          existingSecret: test-instance-minio
          persistence:
            size: 10Gi
---
# The provider generates and persists the root credential on first reconcile.
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-credentials
type: Opaque
data:
  username: cm9vdA==
  (password != null): true
---
# Bundled MinIO gets per-instance root credentials instead of minioadmin.
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-minio
type: Opaque
data:
  (accesskey != null): true
  (secretkey != null): true
