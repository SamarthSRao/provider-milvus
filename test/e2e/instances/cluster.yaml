apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: e2e-cluster
spec:
  providerRef:
    name: milvus
  # Starts one version behind so the run can roll an ordered upgrade.
  version: "2.6.10"
  topology:
    type: cluster
    parameters:
      dependencies:
        etcd:
          replicas: 1
  components:
    proxy:
      type: milvus
      replicas: 1
      service:
        serviceType: NodePort
    mixCoord:
      type: milvus
      replicas: 1
    dataNode:
      type: milvus
      replicas: 1
    queryNode:
      type: milvus
      replicas: 2
      schedulingPolicy:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    core.openeverest.io/instance: e2e-cluster
                    core.openeverest.io/component: queryNode
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
    streamingNode:
      type: milvus
      replicas: 1
